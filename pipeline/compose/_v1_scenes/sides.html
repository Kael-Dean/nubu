<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .col { position: absolute; display: flex; flex-direction: column; gap: 22px; }
  .scard { padding: 18px 28px 22px; display: flex; align-items: center; gap: 18px; font-size: 48px; font-weight: 700; }
  .scard .ic { flex: none; width: 84px; height: 84px; border-radius: 20px; background: #f1e9ff; display: flex; align-items: center; justify-content: center; }
  .scard.hl { background: var(--accent-deep); color: #fff; }
  .scard.hl .ic { background: rgba(255,255,255,0.18); }
  .clockbox { padding: 22px; display: flex; flex-direction: column; align-items: center; }
  #lights { position: absolute; left: 0; top: 0; }
</style></head>
<body>
<script src="../lib/track.js"></script>
<script src="_runtime.js"></script>
<script>
// type: sides — Nubu centred, info cards flanking left/right. Optional fast clock and a band of
// tail lights (also the drawn fallback when there is no stock clip).
// cfg: { left:[{t,icon,text,hl}], right:[...], leftPos:{x,y,w}, rightPos:{x,y,w}, clock:{t,spinUntil}, lights:true }
NB.define({
  build(c) {
    const cfg = c.cfg;
    if (cfg.lights && !c.stockBg) { c.lc = NB.el('canvas', '', c.world); c.lc.id = 'lights'; c.lc.width = c.W; c.lc.height = c.H; c.world.insertBefore(c.lc, c.world.children[c.stockBg ? 2 : 1]); }
    const mk = (list, pos) => {
      const col = NB.el('div', 'col', c.ui); NB.css(col, { left: pos.x + 'px', top: pos.y + 'px', width: pos.w + 'px', alignItems: pos.align || 'stretch' });
      return (list || []).map((it) => {
        if (it.clock) {
          const e = NB.el('div', 'card clockbox', col); e.innerHTML = `<div class="ck"></div><div style="font-size:38px;font-weight:700;line-height:1.5;margin-top:6px">${it.text || ''}</div>`;
          const ck = e.querySelector('.ck'); ck.innerHTML = NB.icon('clock', 200, '#efe6ff', 0, 0);
          return { e, it, ck };
        }
        const e = NB.el('div', 'card scard' + (it.hl ? ' hl' : ''), col, `${it.icon ? `<div class="ic">${NB.icon(it.icon, 64)}</div>` : ''}<div>${it.text}</div>`);
        return { e, it };
      });
    };
    c.L = mk(cfg.left, cfg.leftPos || { x: 80, y: 150, w: 500 });
    c.R = mk(cfg.right, cfg.rightPos || { x: 1340, y: 150, w: 500 });
    c.SL = c.L.map((x) => ({ e: x.e, t: x.it.t, until: x.it.until })); c.SR = c.R.map((x) => ({ e: x.e, t: x.it.t, until: x.it.until }));
    [...c.L, ...c.R].forEach((x) => { x.e.style.width = '100%'; });
    c.rng = NB.rng(21);
    c.cars = Array.from({ length: 60 }, () => ({ lane: Math.floor(c.rng() * 4), x: c.rng() * 2400, sp: 18 + c.rng() * 30, ph: c.rng() * 6 }));
  },
  update(t, c) {
    NB.layoutStack(c.SL, 22); NB.layoutStack(c.SR, 22);
    const all = [...c.L.map((x, i) => [x, -50]), ...c.R.map((x) => [x, 50])];
    for (const [x, dx] of all) {
      NB.enter(x.e, t, x.it.t, { dx, dy: 0, dur: 0.5, exitAt: x.it.until });
      if (x.ck) {
        // clock hands spin fast, then ease to rest
        const s = x.it.spinUntil ?? c.end;
        const run = Math.min(t, s) - x.it.t + (t > s ? NB.ease.outCubic(NB.p(t, s, 1.2)) * 0.6 : 0);
        const a2 = Math.max(0, run) * 9, a1 = a2 / 12;
        x.ck.innerHTML = NB.icon('clock', 200, '#efe6ff', a1, a2);
      }
    }
    if (c.lc) {
      const g = c.lc.getContext('2d'); g.clearRect(0, 0, c.W, c.H);
      const base = c.H * 0.80;
      for (const car of c.cars) {
        // slow crawl: traffic jam
        const x = ((car.x + t * car.sp) % 2400) - 240;
        const y = base + car.lane * 34 + Math.sin(t + car.ph) * 1.5;
        const r = 7 + car.lane * 2.5;
        for (const off of [0, 46 + car.lane * 6]) {
          const gr = g.createRadialGradient(x + off, y, 0, x + off, y, r * 4);
          const a = 0.55 + 0.25 * Math.sin(t * 2 + car.ph);
          gr.addColorStop(0, `rgba(255,70,90,${a})`); gr.addColorStop(1, 'rgba(255,70,90,0)');
          g.fillStyle = gr; g.beginPath(); g.arc(x + off, y, r * 4, 0, 6.283); g.fill();
          g.fillStyle = `rgba(255,190,200,${a})`; g.beginPath(); g.arc(x + off, y, r * 0.6, 0, 6.283); g.fill();
        }
      }
    }
  },
});
</script>
</body></html>
