<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .kick { font-family: var(--font-display); font-weight: var(--display-weight); color: var(--on-bg); line-height: 1.3; text-wrap: balance; }
  .odo { display: flex; align-items: flex-end; gap: 0.02em; font-family: var(--font-display); font-weight: var(--display-weight); color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
  .odo .col { position: relative; height: 1.08em; width: 0.62em; overflow: hidden; }
  .odo .strip { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; }
  .odo .strip span { height: 1.08em; display: flex; align-items: center; justify-content: center; }
  .odo .sep { width: 0.26em; height: 1.08em; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 0.1em; }
  .odo .shadow { text-shadow: 0 0.05em 0 oklch(0.18 0.08 302 / .55); }
  .lab { padding: 10px 34px 16px; font-family: var(--font-display); font-weight: var(--display-weight); line-height: 1.3; letter-spacing: 0.08em; }
  .sub { font-weight: 700; color: var(--on-bg); line-height: 1.5; text-wrap: balance; }
  .chip { padding: 10px 28px 14px; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .crowd circle { mix-blend-mode: screen; }
</style></head>
<body>
<script src="../lib/track.js"></script>
<script src="_runtime.js"></script>
<script>
// type: counter — rolling day counter (odometer) + optional drawn stadium whose crowd lights up purple.
// cfg: { box:{x,y,w}, kicker:{text,at,size}, value:{from,to,at,dur,size}, unit:{text,at,size}, sub:{text,at,size,hl},
//        chips:[{text,at}], chipsPos:{x,y}, stadium:{x,y,scale,at,lightsAt,lightsFull,n,wave}, hearts:true, exitAt }
NB.define({
  build(c) {
    const cfg = c.cfg, ui = c.ui;
    if (cfg.hearts !== false) c.heartsUpd = NB.hearts(c.world, { n: 5, seed: 23, x0: 80, x1: c.W - 80, y0: 0, y1: c.H, speed: 30, at: c.start, alpha: 0.8, min: 36, max: 64 });
    // drawn stadium + crowd lights (SVG), behind the text
    const S = cfg.stadium;
    if (S) {
      const sc = S.scale || 2.4, X = 180, Y = 140;
      const r = NB.rng(41);
      const n = S.n || 230;
      let dots = '';
      c.dots = [];
      for (let i = 0; i < n; i++) {
        // points in the stands ring (between the pitch ellipse and the rim)
        const a = r() * Math.PI * 2, k = 0.55 + r() * 0.4;
        const x = X + Math.cos(a) * 130 * k, y = Y + Math.sin(a) * 80 * k;
        const rr = 1.6 + r() * 1.8;
        dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" fill="oklch(0.78 0.2 302)"/>`;
        c.dots.push({ ph: r() * 6.28, sp: 1.5 + r() * 2.5, a });
      }
      const w = 360 * sc, h = 420 * sc;
      const g = NB.el('div', 'abs', c.world, `<svg width="${w}" height="${h}" viewBox="0 0 360 420" style="overflow:visible">
        <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <radialGradient id="halo"><stop offset="0" stop-color="oklch(0.7 0.22 302)" stop-opacity=".9"/><stop offset="1" stop-color="oklch(0.7 0.22 302)" stop-opacity="0"/></radialGradient></defs>
        <ellipse class="halo" cx="${X}" cy="${Y - 10}" rx="230" ry="170" fill="url(#halo)" opacity="0"/>
        <g class="bowl">${NB.stadium(X, Y)}</g>
        <g class="crowd" filter="url(#gl)">${dots}</g>
        <g class="crowd2">${dots}</g></svg>`);
      NB.css(g, { left: S.x - X * sc + 'px', top: S.y - Y * sc + 'px' });
      c.stad = g; c.halo = g.querySelector('.halo');
      c.crowd = [...g.querySelectorAll('.crowd circle')]; c.crowd2 = [...g.querySelectorAll('.crowd2 circle')];
    }
    const B = cfg.box || { x: 80, y: 300, w: c.W - 160 };
    const box = NB.el('div', 'abs', ui); NB.css(box, { left: B.x + 'px', top: B.y + 'px', width: B.w + 'px' });
    if (cfg.kicker) { c.kick = NB.el('div', 'kick', box, cfg.kicker.text); NB.css(c.kick, { fontSize: (cfg.kicker.size || 64) + 'px', marginBottom: '18px' }); }
    if (cfg.value) {
      const V = cfg.value, digits = String(V.to).length;
      c.odo = NB.el('div', 'odo shadow', box); c.odo.style.fontSize = (V.size || 250) + 'px';
      c.cols = [];
      for (let i = 0; i < digits; i++) {
        const place = digits - 1 - i;
        if (i > 0 && place % 3 === 2 && V.sep !== '') NB.el('div', 'sep', c.odo, V.sep ?? ',');
        const col = NB.el('div', 'col', c.odo);
        const strip = NB.el('div', 'strip', col, Array.from({ length: 11 }, (_, d) => `<span>${d % 10}</span>`).join(''));
        c.cols.push({ strip, place });
      }
    }
    if (cfg.unit) { c.lab = NB.el('div', 'sticker lab', box, cfg.unit.text); NB.css(c.lab, { position: 'relative', width: 'fit-content', fontSize: (cfg.unit.size || 70) + 'px', marginTop: '14px' }); }
    if (cfg.sub) {
      let html = cfg.sub.text; if (cfg.sub.hl) html = html.replace(cfg.sub.hl, NB.hl(cfg.sub.hl, 3));
      c.sub = NB.el('div', 'sub', box, html); NB.css(c.sub, { fontSize: (cfg.sub.size || 52) + 'px', marginTop: '26px' });
    }
    if (cfg.chips) {
      const P = cfg.chipsPos || { x: B.x, y: B.y + 420 };
      const row = NB.el('div', 'abs', ui); NB.css(row, { left: P.x + 'px', top: P.y + 'px', display: 'flex', gap: '22px', flexWrap: 'wrap', width: (P.w || 900) + 'px' });
      c.chips = cfg.chips.map((ch) => { const e = NB.el('div', 'sticker chip', row, ch.text); NB.css(e, { position: 'relative', fontSize: (ch.size || 56) + 'px' }); return { e, at: ch.at, accent: ch.accent, until: ch.until }; });
    }
  },
  afterFonts(c) {
    if (c.lab) NB.sticker(c.lab, { seed: 5, fill: 'accent', rot: -2.5 });
    (c.chips || []).forEach((ch, i) => NB.sticker(ch.e, { seed: 11 + i, notch: ch.e.offsetWidth - 60, rot: [-2, 1.5, -1][i % 3], fill: ch.accent ? 'accent' : 'paper' }));
  },
  update(t, c) {
    const cfg = c.cfg, ex = cfg.exitAt;
    if (c.heartsUpd) c.heartsUpd(t);
    if (c.kick) NB.enter(c.kick, t, cfg.kicker.at ?? c.start + 0.1, { dy: 18, exitAt: ex });
    if (c.odo) {
      const V = cfg.value, at = V.at ?? c.start + 0.3, dur = V.dur ?? 2.4;
      NB.enter(c.odo, t, at - 0.15, { dy: 30, scale: 1.06, drot: 0, exitAt: ex });
      const p = NB.ease.outCubic(NB.p(t, at, dur));
      const v = (V.from || 0) + (V.to - (V.from || 0)) * p;
      for (const col of c.cols) {
        const unit = Math.pow(10, col.place);
        let d = (v / unit) % 10;
        // only the column that is actually turning shows the in-between; higher columns snap like a real odometer
        const lower = v % unit, roll = col.place === 0 ? d - Math.floor(d) : Math.max(0, (lower - (unit - 1)) / 1);
        d = Math.floor(d) + Math.min(1, roll);
        col.strip.style.transform = `translateY(${-(d / 11) * 100}%)`;
      }
      // a little pop when it lands
      const land = NB.p(t, at + dur - 0.05, 0.35);
      c.odo.style.scale = String(1 + 0.05 * Math.sin(Math.PI * land));
    }
    if (c.lab) NB.enter(c.lab, t, cfg.unit.at ?? (cfg.value ? (cfg.value.at ?? c.start) + (cfg.value.dur ?? 2.4) : c.start + 0.4), { dy: -10, scale: 1.12, drot: 6, dur: 0.38, exitAt: ex });
    if (c.sub) { NB.enter(c.sub, t, cfg.sub.at ?? c.start + 0.6, { dy: 14, drot: 0, exitAt: ex }); NB.swipe(c.sub, t, (cfg.sub.at ?? c.start + 0.6) + 0.3); }
    (c.chips || []).forEach((ch) => NB.enter(ch.e, t, ch.at, { dy: -8, scale: 1.1, drot: 5, dur: 0.36, exitAt: ch.until ?? ex }));
    if (c.stad) {
      const S = cfg.stadium;
      NB.enter(c.stad, t, S.at ?? c.start, { dy: 40, scale: 1, drot: 0, dur: 0.7 });
      const L = NB.ease.inOutSine(NB.p(t, S.lightsAt ?? c.start, (S.lightsFull ?? (c.start + 2)) - (S.lightsAt ?? c.start)));
      c.halo.setAttribute('opacity', (0.15 + 0.55 * L).toFixed(3));
      c.dots.forEach((d, i) => {
        // shimmer + a slow wave travelling around the bowl (fans swaying their lights)
        const wave = S.wave ? 0.5 + 0.5 * Math.sin(d.a * 3 - t * 2.2) : 1;
        const o = L * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * d.sp + d.ph))) * (0.55 + 0.45 * wave);
        c.crowd[i].setAttribute('opacity', o.toFixed(3));
        c.crowd2[i].setAttribute('opacity', (o * 0.9).toFixed(3));
      });
    }
  },
});
</script>
</body></html>
