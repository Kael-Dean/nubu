<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .wbox { padding: 30px 44px 36px 40px; }
  .wbox svg.ic .fa { fill: var(--paper); }
  .wbox .head { display: flex; align-items: center; gap: 20px; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 78px; line-height: 1.3; padding-top: 6px; }
  .lines { display: grid; }
  .lines > * { grid-area: 1 / 1; }
  .line { display: flex; align-items: center; gap: 20px; font-size: 56px; font-weight: 700; line-height: 1.42; margin-top: 14px; }
  .line .b { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); margin-top: 6px; }
  .stamp { position: relative; margin-top: 26px; width: fit-content; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 104px; line-height: 1.2;
    color: var(--ink); padding: 14px 40px 16px; border: 8px solid var(--ink); border-radius: 14px; box-shadow: inset 0 0 0 6px var(--accent), inset 0 0 0 10px var(--ink); }
  .tips { position: absolute; }
  .tip { width: max-content; display: flex; align-items: center; gap: 18px; padding: 12px 36px 16px 18px; font-size: 52px; font-weight: 700; line-height: 1.45; }
  .art { position: absolute; }
  .art .tag { position: absolute; left: calc(270px * var(--k, 1)); top: -10px; padding: 6px 30px 12px; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 76px; line-height: 1.2; }
</style></head>
<body>
<script src="../lib/track.js"></script>
<script src="_runtime.js"></script>
<script>
// type: warning — caution sticker (highlighter colour, ink type). Lines are written in one by one;
// a `big` line is a rubber stamp that lands with one jolt. Optional tips (paper stickers) and taxi art.
// cfg: { title, icon, lines:[{t,text,big}], jitterAt, tips:[{t,icon,text}], box:{x,y,w}, tipsBox:{x,y,w}, art:{kind,t,until,x,y,strikeAt} }
NB.define({
  build(c) {
    const cfg = c.cfg, B = cfg.box || { x: 100, y: 90, w: 1150 };
    const box = NB.el('div', 'sticker wbox', c.ui); NB.css(box, { left: B.x + 'px', top: B.y + 'px', width: B.w + 'px' });
    c.head = NB.el('div', 'head', box, `${NB.icon(cfg.icon || 'warn', 92)}<span>${cfg.title}</span>`);
    const swap = (cfg.lines || []).some((l) => l.until != null) ? NB.el('div', 'lines', box) : box;
    c.lines = (cfg.lines || []).map((l) => {
      const e = l.big ? NB.el('div', 'stamp', box, l.text) : NB.el('div', 'line', swap, `<span class="b"></span><span>${l.text}</span>`);
      if (l.big) e._rot = -4;
      return { e, l };
    });
    c.box = box;
    if (cfg.tips) {
      const T = cfg.tipsBox || { x: 100, y: 600, w: 1150 };
      const tb = NB.el('div', 'tips', c.ui); NB.css(tb, { left: T.x + 'px', top: T.y + 'px' });
      c.tips = cfg.tips.map((tp) => ({ e: NB.el('div', 'sticker tip', tb, `${NB.icon(tp.icon === 'check' ? 'tick' : tp.icon || 'tick', 84)}<div>${tp.text}</div>`), tp }));
      c.tipItems = c.tips.map((x) => ({ e: x.e, t: x.tp.t }));
    }
    if (cfg.art && cfg.art.kind === 'taxi') {
      const A = cfg.art;
      const a = NB.el('div', 'art', c.ui); NB.css(a, { left: A.x + 'px', top: A.y + 'px' });
      const AS = A.size || 400; a.innerHTML = `<div style="position:relative;width:${AS}px;height:${AS}px;--k:${AS / 400}">${NB.icon('taxi', AS)}
        <div class="tag sticker">฿<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:0;top:0"><path class="draw" pathLength="1" d="M8 72 C36 58 64 44 94 26" style="fill:none;stroke:var(--ink);stroke-width:9;stroke-linecap:round;vector-effect:non-scaling-stroke"/></svg></div></div>`;
      c.art = a; c.tag = a.querySelector('.tag');
    }
  },
  afterFonts(c) {
    NB.sticker(c.box, { seed: 17, r: 20, rot: -0.6, fill: 'accent' });
    if (c.tips) c.tips.forEach((x, i) => NB.sticker(x.e, { seed: 140 + i, r: 18 }));
    if (c.tag) NB.sticker(c.tag, { seed: 150, r: 14, rot: 8 });
  },
  update(t, c) {
    const cfg = c.cfg;
    let jx = 0, jr = 0;
    if (cfg.jitterAt != null && t >= cfg.jitterAt && t < cfg.jitterAt + 0.4) {
      const q = (t - cfg.jitterAt) / 0.4; jx = Math.sin(q * Math.PI * 5) * 10 * (1 - q); jr = Math.sin(q * Math.PI * 4) * 0.6 * (1 - q);
    }
    NB.enter(c.box, t, cfg.boxAt ?? c.start + 0.05, { dy: -12, scale: 1.04, drot: 2.5, dur: 0.45, extra: ` translateX(${jx}px) rotate(${jr}deg)` });
    for (const x of c.lines) {
      if (x.l.big) NB.enter(x.e, t, x.l.t, { dy: 0, scale: 1.3, drot: -6, dur: 0.2 });
      else NB.enter(x.e, t, x.l.t, { dx: -20, dy: 0, scale: 1, drot: 0, dur: 0.34, exitAt: x.l.until, exitDy: 0, exitDur: 0.2 });
    }
    if (c.tips) {
      NB.layoutStack(c.tipItems, 20);
      for (const x of c.tips) { NB.enter(x.e, t, x.tp.t, { dx: -26, dy: 0, scale: 1.05, drot: 3 }); NB.draw(x.e, t, x.tp.t + 0.2, 0.3); }
    }
    if (c.art) {
      const A = cfg.art;
      NB.enter(c.art, t, A.t, { dx: 60, dy: 0, scale: 1, drot: 0, dur: 0.5, exitAt: A.until, exitDy: 20, extra: ` translateY(${Math.sin(t * 2.2) * 3}px)` });
      NB.draw(c.tag, t, A.strikeAt, 0.26);
    }
  },
});
</script>
</body></html>
