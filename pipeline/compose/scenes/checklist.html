<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .panel { padding: 34px 44px 30px 40px; }
  .panel .head { display: flex; align-items: center; gap: 20px; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 74px; line-height: 1.3; padding-top: 6px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 22px; padding: 20px 0 22px; border-top: 4px dashed var(--paper-2); }
  .row .in { flex: 1; display: flex; align-items: center; gap: 22px; }
  .row .box { flex: none; width: 76px; height: 76px; position: relative; }
  .row .ic { flex: none; }
  .row .tx { flex: 1; font-size: 54px; font-weight: 700; line-height: 1.4; text-wrap: balance; }
  .row .tx .sub { display: block; font-size: 38px; font-weight: 500; color: var(--ink-soft); line-height: 1.45; }
  .row.note .tx { font-size: 50px; }
</style></head>
<body>
<script src="../lib/track.js"></script>
<script src="_runtime.js"></script>
<script>
// type: checklist — one paper list, hand-drawn boxes; a marker tick draws into each box on its cue.
// cfg: { title, titleIcon, items:[{t, icon, text, sub, tickAt, note}], panel:{x,y,w}, panelAt }
const BOX = `<svg class="ic" width="76" height="76" viewBox="0 0 100 100"><path class="k" d="M14 12 C40 10 64 13 88 11 C90 38 87 64 89 88 C62 90 38 87 12 89 C10 62 13 38 14 12Z" style="stroke-width:7"/></svg>`;
NB.define({
  build(c) {
    const cfg = c.cfg, P = cfg.panel || { x: 100, y: 80, w: 1150 };
    const panel = NB.el('div', 'sticker panel', c.ui); NB.css(panel, { left: P.x + 'px', top: P.y + 'px', width: P.w + 'px' });
    c.head = NB.el('div', 'head', panel, `${cfg.titleIcon ? NB.icon(cfg.titleIcon, 92) : ''}<span>${cfg.title}</span>`);
    c.items = cfg.items.map((it, i) => {
      const lead = it.note ? '' : `<div class="box">${BOX}${it.tickAt != null ? `<svg class="ic" width="92" height="92" viewBox="0 0 100 100" style="position:absolute;left:-2px;top:-24px">${NB.icons.tick()}</svg>` : ''}</div>`;
      const text = it.note ? NB.hlInline(it.text) : it.text;
      const e = NB.el('div', 'row' + (it.note ? ' note' : ''), panel, `${lead}<div class="in">${it.note ? NB.icon('warn', 76) : NB.icon(it.icon, 84)}<div class="tx">${text}${it.sub ? `<span class="sub">${it.sub}</span>` : ''}</div></div>`);
      return { e, it, inner: e.querySelector('.in') };
    });
    c.panel = panel;
  },
  afterFonts(c) { NB.sticker(c.panel, { seed: 12, r: 22, rot: -0.8 }); },
  update(t, c) {
    const at = c.cfg.panelAt ?? c.start + 0.05;
    NB.enter(c.panel, t, at, { dy: -12, scale: 1.04, drot: 2.5, dur: 0.45 });
    for (const x of c.items) {
      // the ruled line and empty box are part of the list from the start; the entry is written in on its cue
      NB.enter(x.inner, t, x.it.t, { dx: -24, dy: 0, scale: 1, drot: 0, dur: 0.36 });
      if (x.it.tickAt != null) NB.draw(x.e, t, x.it.tickAt, 0.28);
      if (x.it.note) NB.swipe(x.e, t, x.it.t + 0.35, 0.5);
    }
  },
});
</script>
</body></html>
