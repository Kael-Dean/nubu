<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="scenes/_base.css">
<style>
  html, body { background: transparent !important; overflow: hidden; }
  /* subtitles: one ink strip per line (caption tape), looped body face, paper text */
  #sub { position: absolute; display: none; text-align: center; font-family: var(--font-body); font-weight: 700;
    line-height: 1.62; white-space: nowrap; padding: 0 2px; }
  #sub .ln { background: oklch(0.2 0.06 302 / 0.94); color: var(--on-bg); padding: 0.06em 0.36em 0.14em;
    border-radius: 0.16em; -webkit-box-decoration-break: clone; box-decoration-break: clone;
    box-shadow: 0 8px 18px oklch(0.1 0.05 302 / 0.35); }
  /* source tag: small ink slip, top-left */
  #tag { position: absolute; display: none; align-items: flex-start; gap: 12px; font-family: var(--font-body); font-weight: 600;
    color: var(--on-bg); background: oklch(0.2 0.06 302 / 0.9); border-radius: 6px; padding: 2px 16px 5px 12px; line-height: 1.5; max-width: 900px; }
  #tag svg { flex: none; margin-top: 0.3em; color: var(--accent); }
  #meas { position: absolute; visibility: hidden; white-space: nowrap; font-family: var(--font-body); font-weight: 700; }
</style></head>
<body>
<div id="sub"></div><div id="tag"><svg width="22" height="22" viewBox="0 0 100 100"><path d="M24 10 H62 L80 28 V90 H24Z M62 10 V28 H80" style="fill:none;stroke:currentColor;stroke-width:10;stroke-linejoin:round"/><path d="M36 50 H68 M36 68 H60" style="stroke:currentColor;stroke-width:10;stroke-linecap:round"/></svg><span class="tx"></span></div><span id="meas"></span>
<script>
// Renders one UI state (subtitle and/or source tag) on a transparent full frame.
// Subtitles are always laid out centred on x = W/2; ffmpeg slides the whole subtitle layer sideways.
window.renderState = async function (s) {
  if (s.theme) for (const k in s.theme) if (k[0] !== '_') document.documentElement.style.setProperty('--' + k, s.theme[k]);
  document.body.style.width = s.W + 'px'; document.body.style.height = s.H + 'px';
  const sub = document.getElementById('sub'), tag = document.getElementById('tag'), meas = document.getElementById('meas');
  sub.style.display = 'none'; tag.style.display = 'none';
  await document.fonts.ready;
  if (s.sub) {
    const fs = s.sub.fontSize || 46;
    meas.style.fontSize = fs + 'px'; sub.style.fontSize = fs + 'px';
    const toks = s.sub.tokens;
    const pad = fs * 0.72;
    const width = (arr) => { meas.textContent = arr.join(' '); return meas.getBoundingClientRect().width; };
    let lines = [toks];
    // one line when it fits the band (a one-word second line reads worse than a slightly wider strip)
    if (width(toks) > s.sub.maxW - 6 - pad && toks.length > 1) {
      let best = null;
      for (let i = 1; i < toks.length; i++) {
        const a = toks.slice(0, i), b = toks.slice(i);
        const m = Math.max(width(a), width(b));
        if (!best || m < best.m) best = { m, a, b };
      }
      lines = [best.a, best.b];
      // a short orphan line ("แล้ว"): set the cue a little smaller on one line instead (never below 88 %)
      const wa = width(best.a), wb = width(best.b);
      const k = (s.sub.maxW - 6 - pad) / width(toks);
      if (Math.min(wa, wb) < 0.3 * Math.max(wa, wb) && k >= 0.88) {
        lines = [toks];
        sub.style.fontSize = Math.floor(fs * k) + 'px'; meas.style.fontSize = Math.floor(fs * k) + 'px';
      }
    }
    sub.style.whiteSpace = 'nowrap'; sub.style.width = 'auto'; sub.style.textWrap = '';
    if (lines.some((l) => width(l) > s.sub.maxW - 6 - pad + 0.5)) {
      // a single phrase is too long: let Chromium's Thai dictionary line-breaker wrap it
      sub.style.whiteSpace = 'normal'; sub.style.wordBreak = 'normal'; sub.style.textWrap = 'balance';
      sub.style.width = s.sub.maxW + 'px';
      sub.innerHTML = `<span class="ln">${toks.join(' ')}</span>`;
    } else sub.innerHTML = lines.map((l) => `<span class="ln">${l.join(' ')}</span>`).join('<br>');
    sub.style.display = 'block';
    const r = sub.getBoundingClientRect();
    sub.style.left = (s.W / 2 - r.width / 2) + 'px';
    sub.style.top = (s.sub.bottom - r.height) + 'px';
  }
  if (s.tag) {
    tag.querySelector('.tx').textContent = s.tag.text;
    tag.style.fontSize = (s.tag.fontSize || 22) + 'px';
    tag.style.display = 'flex';
    const r = tag.getBoundingClientRect();
    tag.style.left = s.tag.x + 'px';
    tag.style.top = (s.tag.top != null ? s.tag.top : s.H - s.tag.bottom - r.height) + 'px';
  }
  const out = {};
  if (s.sub) { const r = sub.getBoundingClientRect(); out.sub = { x: r.left, y: r.top, w: r.width, h: r.height }; }
  if (s.tag) { const r = tag.getBoundingClientRect(); out.tag = { x: r.left, y: r.top, w: r.width, h: r.height }; }
  return out;
};
</script>
</body></html>
